<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador Local de Landing Pages — Clínicas Odontológicas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#1B365D',
            teal: '#0F766E',
            graphite: '#1C1917'
          },
          fontFamily: {
            sans: ['IBM Plex Sans', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Ferramenta Interna de Produção</span>
        <h1 class="text-lg sm:text-xl font-bold text-slate-900">Gerador Local de Landing Pages Odontológicas</h1>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button type="button" id="btn-baixar-atual" class="bg-navy hover:bg-slate-800 text-white text-xs font-semibold px-4 py-2.5 rounded-sm transition-colors">
          Baixar HTML do Estilo Selecionado
        </button>
        <button type="button" id="btn-baixar-todos" class="bg-white hover:bg-slate-100 text-slate-800 border border-slate-300 text-xs font-semibold px-4 py-2.5 rounded-sm transition-colors">
          Baixar os 4 Estilos (.html)
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

    <!-- Painel de Dados e Placeholders -->
    <section class="lg:col-span-5 bg-white border border-slate-200 rounded-sm p-5 space-y-4">
      <div class="border-b border-slate-200 pb-3">
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-800">1. Escolha o Template</h2>
        <div class="grid grid-cols-2 gap-2 mt-2.5">
          <button type="button" data-tpl="1" class="tpl-btn border border-navy bg-navy text-white text-xs font-semibold py-2.5 px-3 rounded-sm text-left transition-colors">
            <span class="block">Template 1</span>
            <span class="text-[11px] font-normal opacity-85">Clássico / Tradicional</span>
          </button>
          <button type="button" data-tpl="2" class="tpl-btn border border-slate-200 bg-slate-50 text-slate-800 text-xs font-semibold py-2.5 px-3 rounded-sm text-left hover:bg-slate-100 transition-colors">
            <span class="block">Template 2</span>
            <span class="text-[11px] font-normal opacity-75">Clínico / Direto ao Ponto</span>
          </button>
          <button type="button" data-tpl="3" class="tpl-btn border border-slate-200 bg-slate-50 text-slate-800 text-xs font-semibold py-2.5 px-3 rounded-sm text-left hover:bg-slate-100 transition-colors">
            <span class="block">Template 3</span>
            <span class="text-[11px] font-normal opacity-75">Minimalista / Editorial</span>
          </button>
          <button type="button" data-tpl="4" class="tpl-btn border border-slate-200 bg-slate-50 text-slate-800 text-xs font-semibold py-2.5 px-3 rounded-sm text-left hover:bg-slate-100 transition-colors">
            <span class="block">Template 4</span>
            <span class="text-[11px] font-normal opacity-75">Moderno / Alta Conversão</span>
          </button>
        </div>
      </div>

      <form id="generator-form" class="space-y-3.5 text-xs">
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-800">2. Dados Reais da Clínica</h2>

        <!-- Seletor de Cor Principal (HEX) -->
        <div class="bg-slate-50 border border-slate-200 rounded-sm p-3">
          <div class="flex items-center justify-between mb-1.5">
            <label for="input-cor-hex" class="block font-semibold text-slate-700">Cor Principal ({{COR_PRIMARIA}})</label>
            <button type="button" id="btn-reset-cor" class="text-[11px] text-navy hover:underline font-medium">
              Restaurar cor padrão do estilo
            </button>
          </div>
          <div class="flex items-center gap-2">
            <input
              type="color"
              id="input-cor-picker"
              value="#1B365D"
              class="h-9 w-12 border border-slate-300 rounded-sm bg-white p-0.5 cursor-pointer shrink-0"
              title="Escolher cor visualmente"
            >
            <input
              type="text"
              id="input-cor-hex"
              data-key="COR_PRIMARIA"
              value="#1B365D"
              maxlength="7"
              placeholder="#1B365D"
              class="w-full border border-slate-300 rounded-sm px-3 py-2 text-xs font-mono uppercase focus:outline-none focus:border-navy bg-white"
            >
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Nome da Clínica ({{NOME}})</label>
            <input type="text" data-key="NOME" placeholder="Ex: Clínica Odontológica Silva" class="w-full border border-slate-300 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-navy">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Cidade / UF ({{CIDADE}})</label>
            <input type="text" data-key="CIDADE" placeholder="Ex: Campinas - SP" class="w-full border border-slate-300 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-navy">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">WhatsApp ({{WHATSAPP}})</label>
            <input type="text" data-key="WHATSAPP" placeholder="Ex: (19) 99999-9999" class="w-full border border-slate-300 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-navy">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Nota no Google ({{NOTA}})</label>
            <input type="text" data-key="NOTA" placeholder="Ex: 4.9" class="w-full border border-slate-300 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-navy">
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Endereço Completo ({{ENDERECO}})</label>
          <input type="text" data-key="ENDERECO" placeholder="Rua, número, bairro, sala/conjunto" class="w-full border border-slate-300 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-navy">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Link do Google Maps ({{LINK_MAPS}}) <span class="font-normal text-slate-400">(opcional)</span></label>
          <input type="text" data-key="LINK_MAPS" placeholder="Cole o link do Google Maps (se vazio, gera busca pelo endereço)" class="w-full border border-slate-300 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-navy">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Horário de Funcionamento ({{HORARIO}})</label>
          <input type="text" data-key="HORARIO" placeholder="Ex: Segunda a Sexta, das 08h às 18h" class="w-full border border-slate-300 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-navy">
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Avaliação Real 1 ({{AVALIACAO_1}})</label>
          <textarea rows="2" data-key="AVALIACAO_1" placeholder="Cole aqui o texto real da primeira avaliação do Google Maps" class="w-full border border-slate-300 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-navy"></textarea>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Avaliação Real 2 ({{AVALIACAO_2}})</label>
          <textarea rows="2" data-key="AVALIACAO_2" placeholder="Cole aqui o texto real da segunda avaliação do Google Maps" class="w-full border border-slate-300 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-navy"></textarea>
        </div>

        <div>
          <label class="block font-semibold text-slate-700 mb-1">Avaliação Real 3 ({{AVALIACAO_3}})</label>
          <textarea rows="2" data-key="AVALIACAO_3" placeholder="Cole aqui o texto real da terceira avaliação do Google Maps" class="w-full border border-slate-300 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-navy"></textarea>
        </div>
      </form>
    </section>

    <!-- Pré-visualização ao Vivo -->
    <section class="lg:col-span-7 bg-white border border-slate-200 rounded-sm flex flex-col h-[860px]">
      <div class="border-b border-slate-200 px-4 py-3 flex items-center justify-between bg-slate-50">
        <div class="text-xs font-semibold text-slate-700">
          Pré-visualização em Tempo Real — <span id="preview-label" class="text-navy">template_1.html (Estilo Clássico)</span>
        </div>
        <div class="flex items-center gap-4">
          <button type="button" id="btn-abrir-aba" class="text-xs font-semibold text-slate-600 hover:text-navy hover:underline">
            Abrir Preview em Nova Aba
          </button>
          <button type="button" id="btn-copiar-codigo" class="text-xs font-semibold text-navy hover:underline">
            Copiar Código HTML
          </button>
        </div>
      </div>
      <iframe id="preview-frame" title="Preview da Landing Page" class="w-full flex-1 border-0 bg-white"></iframe>
    </section>

  </main>

    }

    Object.keys(encodedTemplates).forEach(function (k) {
      rawTemplates[k] = decodeBase64UTF8(encodedTemplates[k]);
    });

    var templateLabels = {
      "1": "template_1.html (Estilo Clássico / Consultório Tradicional)",
      "2": "template_2.html (Estilo Clínico / Direto ao Ponto)",
      "3": "template_3.html (Estilo Minimalista / Editorial)",
      "4": "template_4.html (Estilo Moderno / Alta Conversão)"
    };

    var colorPicker = document.getElementById("input-cor-picker");
    var colorHexInput = document.getElementById("input-cor-hex");
    var btnResetCor = document.getElementById("btn-reset-cor");

    function normalizeHex(val, fallback) {
      var s = (val || "").trim();
      if (!s) return fallback;
      if (s.charAt(0) !== "#") s = "#" + s;
      if (/^#[0-9A-Fa-f]{6}$/.test(s)) return s.toUpperCase();
      if (/^#[0-9A-Fa-f]{3}$/.test(s)) {
        return ("#" + s[1] + s[1] + s[2] + s[2] + s[3] + s[3]).toUpperCase();
      }
      return fallback;
    }

    function setColorInputs(hexValue) {
      var clean = normalizeHex(hexValue, defaultTemplateColors[currentTemplateId]);
      colorPicker.value = clean;
      colorHexInput.value = clean;
    }

    colorPicker.addEventListener("input", function () {
      userHasCustomColor = true;
      colorHexInput.value = colorPicker.value.toUpperCase();
      updatePreview();
    });

    colorHexInput.addEventListener("input", function () {
      userHasCustomColor = true;
      var raw = colorHexInput.value.trim();
      var candidate = raw.charAt(0) === "#" ? raw : "#" + raw;
      if (/^#[0-9A-Fa-f]{6}$/.test(candidate)) {
        colorPicker.value = candidate.toUpperCase();
        updatePreview();
      } else if (/^#[0-9A-Fa-f]{3}$/.test(candidate)) {
        var expanded = ("#" + candidate[1] + candidate[1] + candidate[2] + candidate[2] + candidate[3] + candidate[3]).toUpperCase();
        colorPicker.value = expanded;
        updatePreview();
      }
    });

    colorHexInput.addEventListener("blur", function () {
      setColorInputs(colorHexInput.value);
      updatePreview();
    });

    btnResetCor.addEventListener("click", function () {
      userHasCustomColor = false;
      setColorInputs(defaultTemplateColors[currentTemplateId]);
      updatePreview();
    });

    async function loadTemplates() {
      for (var id of ["1", "2", "3", "4"]) {
        try {
          var res = await fetch("template_" + id + ".html");
          if (res.ok) {
            rawTemplates[id] = await res.text();
          }
        } catch (err) {
          // Usa automaticamente a versão Base64 embutida quando aberto via file://
        }
      }
      updatePreview();
    }

    function getFormData(templateIdForFallback) {
      var tid = templateIdForFallback || currentTemplateId;
      var data = {};
      var rawEndereco = "";
      document.querySelectorAll("[data-key]").forEach(function (el) {
        var k = el.getAttribute("data-key");
        var v = el.value.trim();
        if (k === "ENDERECO") {
          rawEndereco = v;
        }
        if (k === "COR_PRIMARIA") {
          var fallbackColor = defaultTemplateColors[tid] || "#1B365D";
          data[k] = userHasCustomColor ? normalizeHex(v, fallbackColor) : fallbackColor;
        } else if (k === "LINK_MAPS") {
          data[k] = v;
        } else {
          data[k] = v !== "" ? v : "{{" + k + "}}";
        }
      });
      if (!data["LINK_MAPS"]) {
        data["LINK_MAPS"] = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(rawEndereco);
      }
      return data;
    }

    function compileTemplate(id) {
      var tpl = rawTemplates[id] || "";
      var data = getFormData(id);
      var output = tpl;
      Object.keys(data).forEach(function (key) {
        var pattern = new RegExp("\\{\\{" + key + "\\}\\}", "g");
        output = output.replace(pattern, data[key]);
      });
      return output;
    }

    function updatePreview() {
      var frame = document.getElementById("preview-frame");
      var label = document.getElementById("preview-label");
      label.textContent = templateLabels[currentTemplateId];
      frame.srcdoc = compileTemplate(currentTemplateId);
    }

    function slugify(str) {
      return (str || "clinica")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/(^-|-$)/g, "") || "clinica";
    }

    function downloadHTML(id) {
      var html = compileTemplate(id);
      var nomeInput = document.querySelector("[data-key='NOME']").value.trim();
      var slug = slugify(nomeInput);
      var blob = new Blob([html], { type: "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = slug + "_template_" + id + ".html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.querySelectorAll(".tpl-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        currentTemplateId = btn.getAttribute("data-tpl");
        if (!userHasCustomColor) {
          setColorInputs(defaultTemplateColors[currentTemplateId]);
        }
        document.querySelectorAll(".tpl-btn").forEach(function (b) {
          b.className = "tpl-btn border border-slate-200 bg-slate-50 text-slate-800 text-xs font-semibold py-2.5 px-3 rounded-sm text-left hover:bg-slate-100 transition-colors";
        });
        btn.className = "tpl-btn border border-navy bg-navy text-white text-xs font-semibold py-2.5 px-3 rounded-sm text-left transition-colors";
        updatePreview();
      });
    });

    document.querySelectorAll("[data-key]").forEach(function (input) {
      if (input.id !== "input-cor-hex") {
        input.addEventListener("input", updatePreview);
      }
    });

    document.getElementById("btn-baixar-atual").addEventListener("click", function () {
      downloadHTML(currentTemplateId);
    });

    document.getElementById("btn-baixar-todos").addEventListener("click", function () {
      ["1", "2", "3", "4"].forEach(function (id) {
        downloadHTML(id);
      });
    });

    document.getElementById("btn-abrir-aba").addEventListener("click", function () {
      var html = compileTemplate(currentTemplateId);
      var blob = new Blob([html], { type: "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      window.open(url, "_blank");
    });

    document.getElementById("btn-copiar-codigo").addEventListener("click", function () {
      var html = compileTemplate(currentTemplateId);
      navigator.clipboard.writeText(html);
      var btn = document.getElementById("btn-copiar-codigo");
      var original = btn.textContent;
      btn.textContent = "Código Copiado!";
      setTimeout(function () { btn.textContent = original; }, 1800);
    });

    loadTemplates();
  </script>
</body>
</html>
